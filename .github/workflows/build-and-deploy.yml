# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages
on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main
# A new commit on a pull request cancels the older run of that pull request.
# A run on main is never cancelled, so a deploy cannot stop halfway.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run typecheck
    build:
        # The build runs in parallel with the tests. The deploy job waits for both.
        # Pull requests only run the tests; they do not build or deploy.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - run: npm ci
            - run: npx nuxt build --preset github_pages
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./.output/public
    # Deployment job
    deploy:
        # Deploy only when both the tests and the build passed
        needs: [test, build]
        # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
        permissions:
            pages: write # to deploy to Pages
            id-token: write # to verify the deployment originates from an appropriate source
        # Deploy to the github_pages environment
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        # Specify runner + deployment step
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
